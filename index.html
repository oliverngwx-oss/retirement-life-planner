<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retirement Life Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

      theme: { extend: { fontFamily: { serif: ['Georgia','Cambria','"Times New Roman"','serif'] } } }
    }
    /* ── Shared plan data (replaced when a plan is exported as a shareable file) ── */
    window.__SHARED_PLAN__ = null;
    /* ── Cache page HTML on load for shareable file export ── */
    window.__PAGE_TEMPLATE__ = null;
    window.addEventListener('load', function() {
      fetch(window.location.href)
        .then(function(r){ return r.text(); })
        .then(function(html){ window.__PAGE_TEMPLATE__ = html; })
        .catch(function(){});
    });
  </script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{background:#F7F6F3;font-family:system-ui,-apple-system,sans-serif;margin:0}
    .tooltip-wrap{position:relative;display:inline-flex}
    .tooltip-box{visibility:hidden;opacity:0;background:#1c1917;color:#e7e5e4;padding:6px 10px;
      border-radius:6px;font-size:11px;line-height:1.5;position:absolute;bottom:calc(100% + 6px);
      left:50%;transform:translateX(-50%);white-space:normal;z-index:200;width:200px;text-align:center;
      transition:opacity 0.15s;pointer-events:none}
    .tooltip-wrap:hover .tooltip-box{visibility:visible;opacity:1}
    .slide-in{animation:slideIn 0.25s ease-out}
    @keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1}
    .progress-bar-fill{transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#f5f5f4}
    ::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:3px}
    @keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(20px)}}
    .toast-in{animation:toastIn 0.3s ease-out forwards}
    .toast-out{animation:toastOut 0.3s ease-in forwards}
    @media print{
      .no-print{display:none!important}
      body{background:white}

</head>

  {year:'2018',rate:0.4},{year:'2019',rate:0.6},{year:'2020',rate:-0.2},

// ─── Calculations ───────────────────────────────────────────────────────────────

function calcResults(s){
  const yearsToRetirement   = Math.max(0,(s.retirementAge||65)-(s.currentAge||35));
  const retirementDuration  = Math.max(0,(s.planningAge||85)-(s.retirementAge||65));
  const currentMonthlyNeed  = Object.values(s.expenses||{}).reduce((a,b)=>a+(+b||0),0);
  const inf = (+s.inflationRate||3)/100;
  const futureMonthlyNeed   = currentMonthlyNeed*Math.pow(1+inf,yearsToRetirement);
  const simpleTotalFundNeeded = futureMonthlyNeed*12*retirementDuration;
  const totalCurrentAssets  = (+s.currentCashSavings||0)+(+s.currentInvestments||0)+(+s.currentCPF||0)+(+s.currentRetirementPlans||0);
  const ar = (+s.preRetirementReturn||0)/100;
  const fvCurrentAssets     = totalCurrentAssets*Math.pow(1+ar,yearsToRetirement);
  const mr = ar/12, nm = yearsToRetirement*12, pmt = +s.monthlyContribution||0;
  const fvMonthlyContributions = mr===0||nm===0 ? pmt*nm : pmt*((Math.pow(1+mr,nm)-1)/mr);
  const projectedAssetsAtRetirement = fvCurrentAssets+fvMonthlyContributions;
  const monthlyRetirementIncome = (+s.cpfLifeMonthly||0)+(+s.rentalIncome||0)+(+s.businessIncome||0)+(+s.passiveIncome||0)+(+s.otherRetirementIncome||0);
  const projectedMonthlyFromAssets = retirementDuration>0 ? projectedAssetsAtRetirement/(retirementDuration*12) : 0;
  const totalProjectedMonthlyIncome = monthlyRetirementIncome+projectedMonthlyFromAssets;
  const retirementGap    = simpleTotalFundNeeded-projectedAssetsAtRetirement;
  const goalProgress     = simpleTotalFundNeeded>0 ? Math.min(150,(projectedAssetsAtRetirement/simpleTotalFundNeeded)*100) : 0;
  const monthlyIncomeGap = futureMonthlyNeed-totalProjectedMonthlyIncome;
  let monthlyTopUp=0;
  if(retirementGap>0&&nm>0){ monthlyTopUp = mr===0 ? retirementGap/nm : retirementGap*mr/(Math.pow(1+mr,nm)-1); }
  return {yearsToRetirement,retirementDuration,currentMonthlyNeed,futureMonthlyNeed,simpleTotalFundNeeded,
    totalCurrentAssets,fvCurrentAssets,fvMonthlyContributions,projectedAssetsAtRetirement,
    monthlyRetirementIncome,projectedMonthlyFromAssets,totalProjectedMonthlyIncome,
    retirementGap,goalProgress,monthlyIncomeGap,monthlyTopUp};
}

// ─── Sharing ────────────────────────────────────────────────────────────────────

function encodeState(data){
  try{ return btoa(encodeURIComponent(JSON.stringify(data))); }catch{ return null; }
}
function decodeState(encoded){
  try{ return JSON.parse(decodeURIComponent(atob(encoded))); }catch{ return null; }
}
function getShareUrl(data){
  const encoded = encodeState(data);
  if(!encoded) return null;
  return `${window.location.origin}${window.location.pathname}#plan=${encoded}`;
}
async function exportShareableFile(data){
  let html = window.__PAGE_TEMPLATE__;
  if(!html){
    try{ const r=await fetch(window.location.href); html=await r.text(); }
    catch{ return false; }
  }
  const stateJson = JSON.stringify(data);
  const updated = html.replace(
    'window.__SHARED_PLAN__ = null;',
    `window.__SHARED_PLAN__ = ${stateJson};`
  );
  const blob = new Blob([updated],{type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=`retirement-plan-${data.name||'shared'}.html`; a.click();
  URL.revokeObjectURL(url);
  return true;
}

// ─── Formatting ─────────────────────────────────────────────────────────────────

const fmt    = (v,cur='SGD')=>(!isFinite(v)||isNaN(v))?`${cur} 0`:`${cur} ${Math.round(v).toLocaleString()}`;
const fmtPct = v=>isFinite(v)&&!isNaN(v)?`${Math.round(Math.min(v,999))}%`:'0%';

const Btn = ({children,onClick,variant='primary',disabled=false,size='md'})=>{

    primary: {...base,background:'#15803d',color:'white'},
    secondary:{...base,background:'white',border:'1px solid #d6d3d1',color:'#44403c'},
    ghost:   {...base,background:'transparent',color:'#57534e'},

  };
  return <button onClick={disabled?null:onClick} style={V[variant]||V.primary}>{children}</button>;
};
const ProgressBar = ({value,max=100,color='green'})=>{
  const pct=Math.min(100,Math.max(0,(value/max)*100));
  const bg=color==='green'?'#16a34a':color==='amber'?'#d97706':'#ef4444';
  return(
    <div style={{background:'#e7e5e4',borderRadius:99,height:8,overflow:'hidden'}}>
      <div className="progress-bar-fill" style={{height:8,borderRadius:99,background:bg,width:`${pct}%`}}/>
    </div>
  );
};
const DonutChart = ({progress,size=130})=>{
  const r=42,circ=2*Math.PI*r;
  const pct=Math.min(150,Math.max(0,progress));
  const disp=Math.min(100,pct);
  const offset=circ-(disp/100)*circ;
  const color=pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626';
  return(
    <svg width={size} height={size} viewBox="0 0 100 100">
      <circle cx="50" cy="50" r={r} fill="none" stroke="#f5f5f4" strokeWidth="14"/>
      <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="14"
        strokeDasharray={circ} strokeDashoffset={offset}
        strokeLinecap="round" transform="rotate(-90 50 50)"
        style={{transition:'stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1)'}}/>
      <text x="50" y="46" textAnchor="middle" fontSize="15" fontWeight="800" fill="#1c1917">{Math.round(pct)}%</text>
      <text x="50" y="59" textAnchor="middle" fontSize="7" fill="#78716c">of goal</text>
    </svg>
  );
};

// ─── Toast ───────────────────────────────────────────────────────────────────────

const ToastContext = React.createContext(null);
const ToastProvider = ({children})=>{
  const [toasts,setToasts]=useState([]);
  const showToast = useCallback((msg,type='success')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2800);
  },[]);
  return(
    <ToastContext.Provider value={showToast}>
      {children}
      <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',
        display:'flex',flexDirection:'column',gap:8,zIndex:9999,alignItems:'center'}}>
        {toasts.map(t=>(
          <div key={t.id} className="toast-in" style={{
            background:t.type==='error'?'#1c1917':'#1c1917',
            color:'white',borderRadius:12,padding:'10px 18px',
            fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:8,
            boxShadow:'0 8px 24px rgba(0,0,0,0.2)',whiteSpace:'nowrap'}}>
            <span>{t.type==='success'?'✓':t.type==='error'?'✕':'ℹ'}</span>
            {t.msg}
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
};
const useToast = ()=>React.useContext(ToastContext);

const InflationChart = ()=>{
  const max=Math.max(...INFLATION_DATA.map(d=>Math.abs(d.rate)));

// ─── Questionnaire ────────────────────────────────────────────────────────────────

const QuestionnairePage = ({data,setData,onComplete,onBack})=>{
  const [step,setStep]=useState(1);
  const [errs,setErrs]=useState({});
  const u=(key,val)=>setData(prev=>({...prev,[key]:val}));
  const validate=()=>{
    const e={};
    if((data.currentAge||0)<18||(data.currentAge||0)>100) e.currentAge='Please enter a valid age between 18 and 100.';
    if((data.retirementAge||0)<=(data.currentAge||0)) e.retirementAge='Retirement age must be greater than your current age.';
    if((data.planningAge||0)<=(data.retirementAge||0)) e.planningAge='Planning age must be greater than retirement age.';
    setErrs(e); return Object.keys(e).length===0;
  };
  const next=()=>{
    if(step===1&&!validate()) return;
    if(step<10){setStep(s=>s+1);window.scrollTo(0,0);}else onComplete();
  };
  const prev=()=>{
    if(step>1){setStep(s=>s-1);window.scrollTo(0,0);}else onBack();
  };
  const p={s:data,u,errs};
  return(
    <div style={{minHeight:'100vh',background:'#F7F6F3'}}>
      <header className="no-print" style={{background:'white',borderBottom:'1px solid #e7e5e4',padding:'14px 20px',display:'flex',alignItems:'center',gap:12}}>
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:'#a8a29e',display:'flex'}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:15,color:'#1c1917'}}>Retirement Life Planner</span>
      </header>
      <div style={{maxWidth:660,margin:'0 auto',padding:'28px 20px 80px'}}>
        <StepNav step={step} total={10}/>
        <Card style={{padding:28,marginBottom:20}}>
          {step===1&&<Step1 {...p}/>}  {step===2&&<Step2 {...p}/>}
          {step===3&&<Step3 {...p}/>}  {step===4&&<Step4 {...p}/>}
          {step===5&&<Step5 {...p}/>}  {step===6&&<Step6 {...p}/>}
          {step===7&&<Step7 {...p}/>}  {step===8&&<Step8 {...p}/>}
          {step===9&&<Step9 {...p}/>}  {step===10&&<Step10 {...p}/>}
        </Card>
        <div className="no-print" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <Btn variant="secondary" onClick={prev}>{step===1?'← Home':'← Back'}</Btn>
          <Btn onClick={next}>{step===10?'View My Report →':'Continue →'}</Btn>
        </div>
      </div>
    </div>
  );
};

const ShareModal = ({data,onClose})=>{

  const shareUrl=getShareUrl(data);

  const copyLink=async()=>{
    if(!shareUrl){showToast('Could not generate share link','error');return;}
    try{
      await navigator.clipboard.writeText(shareUrl);
      showToast('Share link copied to clipboard!');
    }catch{
      const ta=document.createElement('textarea');
      ta.value=shareUrl; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('Share link copied!');
    }
  };

  const downloadFile=async()=>{
    setLoading(true);
    const ok=await exportShareableFile(data);
    setLoading(false);

    else{showToast('Could not generate file. Try right-clicking and "Save As" the page.','error');}

    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}

              {label:surplus?'Retirement Surplus':'Retirement Fund Gap',value:fmt(Math.abs(r.retirementGap),data.currency),hl:surplus,am:!surplus},
              {label:'Years Available',value:`${r.yearsToRetirement} years`},
            ].map(item=>(
              <div key={item.label} style={{background:item.hl?'#f0fdf4':item.am?'#fffbeb':'#fafaf9',
                border:`1px solid ${item.hl?'#bbf7d0':item.am?'#fde68a':'#e7e5e4'}`,borderRadius:10,padding:'12px 14px'}}>
                <div style={{fontSize:10,color:'#a8a29e',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.06em'}}>{item.label}</div>
                <div style={{fontWeight:800,fontSize:14,color:item.hl?'#15803d':item.am?'#b45309':'#1c1917'}}>{item.value}</div>
              </div>
            ))}
          </div>
          {!surplus&&(
            <div style={{background:'#fffbeb',border:'2px solid #fde68a',borderRadius:14,padding:20,textAlign:'center'}}>
              <div style={{fontSize:10,color:'#92400e',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6}}>Estimated Additional Monthly Savings Needed</div>
              <div style={{fontWeight:800,fontSize:28,color:'#b45309'}}>{fmt(r.monthlyTopUp,data.currency)}<span style={{fontSize:14,color:'#d97706'}}>/month</span></div>
              <div style={{fontSize:10,color:'#78716c',marginTop:6}}>to close the gap by age {data.retirementAge}, assuming {data.preRetirementReturn}% annual return</div>
            </div>
          )}
        </Sec>

        {/* 5 */}
        <Sec num="5" title="Planning Focus Areas">
          <div style={{fontSize:12,fontWeight:700,color:'#44403c',marginBottom:12}}>{focus.heading}</div>
          <ul style={{listStyle:'none',padding:0,margin:0,display:'flex',flexDirection:'column',gap:8}}>
            {focus.areas.map((area,i)=>(
              <li key={i} style={{display:'flex',alignItems:'flex-start',gap:10}}>
                <span style={{width:22,height:22,borderRadius:'50%',
                  background:focus.tone==='surplus'?'#dcfce7':focus.tone==='near'?'#dbeafe':'#fef9c3',
                  color:focus.tone==='surplus'?'#15803d':focus.tone==='near'?'#1d4ed8':'#92400e',
                  fontSize:11,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>
                  {i+1}
                </span>
                <span style={{fontSize:13,color:'#44403c',lineHeight:1.6}}>{area}</span>
              </li>
            ))}
          </ul>
        </Sec>

        {/* 6 */}
        <Card style={{background:'#fafaf9',padding:20,marginBottom:16}}>
          <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
            <span style={{fontSize:16,flexShrink:0}}>ℹ️</span>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'#44403c',marginBottom:4}}>Important Reminder</div>
              <p style={{fontSize:11,color:'#78716c',lineHeight:1.7,margin:0}}>
                This estimate is for planning purposes only. Actual retirement needs may change depending on inflation, investment returns, healthcare costs, family responsibilities, policy changes, and lifestyle changes. We recommend reviewing your plan at least once a year, or whenever there is a significant life event. Consider working with a licensed financial adviser for personalised guidance.
              </p>
            </div>
          </div>
        </Card>

        {/* 7 */}
        <Sec num="7" title="Suggested Next Steps">
          <ol style={{listStyle:'none',padding:0,margin:0,display:'flex',flexDirection:'column',gap:10}}>
            {[
              'Confirm your desired retirement lifestyle and review your monthly expense estimates',
              'Review your current retirement income sources and projected growth trajectory',
              'Identify your retirement income gap and decide on a concrete contribution strategy',
              'Set up or increase your monthly retirement savings and investment contributions',
              'Review this plan at least once a year or after any major life change',
            ].map((step,i)=>(
              <li key={i} style={{display:'flex',alignItems:'flex-start',gap:12}}>
                <span style={{width:24,height:24,borderRadius:'50%',background:'#1c1917',color:'white',
                  fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>
                  {i+1}
                </span>
                <span style={{fontSize:13,color:'#44403c',lineHeight:1.6}}>{step}</span>
              </li>
            ))}
          </ol>
        </Sec>

        {/* Assumptions */}
        <Card style={{background:'#fafaf9',padding:20}}>
          <div style={{fontSize:11,fontWeight:700,color:'#57534e',marginBottom:10,textTransform:'uppercase',letterSpacing:'0.06em'}}>Key Assumptions Used</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
            {[
              {label:'Inflation Rate',value:`${data.inflationRate}%`},
              {label:'Pre-Retirement Return',value:`${data.preRetirementReturn}%`},
              {label:'Portfolio Return (Retirement)',value:`${data.portfolioReturnDuringRetirement}%`},
              {label:'Withdrawal Strategy',value:data.withdrawalStrategy},
            ].map(item=>(
              <div key={item.label} style={{background:'white',border:'1px solid #e7e5e4',borderRadius:8,padding:'10px 8px',textAlign:'center'}}>
                <div style={{fontSize:9,color:'#a8a29e',marginBottom:3}}>{item.label}</div>
                <div style={{fontSize:12,fontWeight:700,color:'#44403c',textTransform:'capitalize'}}>{item.value}</div>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
};

// ─── Saved Reports Page ────────────────────────────────────────────────────────────

const SavedReportsPage = ({reports,onView,onDelete,onDuplicate,onHome,onNew})=>{
  const [comparing,setComparing]=useState([]);
  const [delConfirm,setDelConfirm]=useState(null);
  const showToast=useToast();

  const toggleCompare=id=>setComparing(p=>p.includes(id)?p.filter(x=>x!==id):p.length<2?[...p,id]:p);

  const exportJSON=report=>{
    const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`retirement-plan-${report.data.name||'report'}.json`; a.click();
    URL.revokeObjectURL(url); showToast('Exported!');
  };

  const shareReport=async report=>{
    const ok=await exportShareableFile(report.data);
    if(ok) showToast('Shareable file downloaded!');
    else showToast('Could not generate file — try the Share button on the report view.','error');
  };

  const compareReports=comparing.map(id=>reports.find(r=>r.id===id)).filter(Boolean);
  return(
    <div style={{minHeight:'100vh',background:'#F7F6F3'}}>
      <header style={{background:'white',borderBottom:'1px solid #e7e5e4',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={onHome} style={{background:'none',border:'none',cursor:'pointer',color:'#a8a29e',display:'flex'}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:15,color:'#1c1917'}}>Saved Reports</span>
          <span style={{background:'#f5f5f4',borderRadius:99,padding:'2px 8px',fontSize:11,fontWeight:700,color:'#78716c'}}>{reports.length}</span>
        </div>
        <Btn onClick={onNew} size="sm">+ New Plan</Btn>
      </header>

      <div style={{maxWidth:860,margin:'0 auto',padding:'24px 20px 60px'}}>
        {reports.length===0?(
          <div style={{textAlign:'center',padding:'80px 20px'}}>
            <div style={{fontSize:48,marginBottom:16}}>📋</div>
            <h3 style={{fontFamily:'Georgia,serif',fontSize:20,fontWeight:700,color:'#44403c',marginBottom:8}}>No saved reports yet</h3>
            <p style={{fontSize:13,color:'#a8a29e',marginBottom:20}}>Create your first retirement plan to see your results saved here.</p>
            <Btn onClick={onNew}>Start Planning →</Btn>
          </div>
        ):(
          <>
            {comparing.length===2&&(
              <div style={{background:'white',border:'1px solid #e7e5e4',borderRadius:16,padding:20,marginBottom:20}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                  <span style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:15,color:'#1c1917'}}>Side-by-Side Comparison</span>
                  <Btn onClick={()=>setComparing([])} variant="ghost" size="sm">Clear</Btn>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  {compareReports.map(report=>{
                    const r=calcResults(report.data);
                    return(
                      <div key={report.id} style={{background:'#fafaf9',borderRadius:12,padding:16}}>
                        <div style={{fontWeight:700,fontSize:14,color:'#1c1917',marginBottom:12}}>{report.data.name||'Unnamed Plan'}</div>
                        {[
                          {l:'Retire at',v:`Age ${report.data.retirementAge}`},
                          {l:'Lifestyle',v:LIFESTYLE_PRESETS[report.data.lifestyleChoice]?.label||'Custom'},
                          {l:'Fund Needed',v:fmt(r.simpleTotalFundNeeded,report.data.currency)},
                          {l:'Projected Assets',v:fmt(r.projectedAssetsAtRetirement,report.data.currency)},
                          {l:'Goal Progress',v:fmtPct(r.goalProgress)},
                          {l:'Monthly Top-Up Needed',v:fmt(r.monthlyTopUp,report.data.currency)},
                        ].map(item=>(
                          <div key={item.l} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #e7e5e4'}}>
                            <span style={{fontSize:11,color:'#78716c'}}>{item.l}</span>
                            <span style={{fontSize:12,fontWeight:700,color:'#1c1917'}}>{item.v}</span>
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            {comparing.length===1&&(
              <div style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:10,padding:'10px 16px',marginBottom:16,fontSize:12,color:'#1e40af'}}>
                ℹ️ Select one more report to compare side by side.
              </div>
            )}
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:16}}>
              {reports.map(report=>{
                const r=calcResults(report.data);
                const surplus=r.retirementGap<=0;
                const isComp=comparing.includes(report.id);
                const status=surplus?{bg:'#dcfce7',tc:'#15803d',label:'Surplus'}
                  :r.goalProgress>=70?{bg:'#fef9c3',tc:'#92400e',label:'On Track'}
                  :{bg:'#fee2e2',tc:'#dc2626',label:'Gap'};
                return(
                  <div key={report.id} style={{background:'white',borderRadius:16,padding:20,
                    border:`2px solid ${isComp?'#93c5fd':'#e7e5e4'}`,
                    outline:isComp?'3px solid #bfdbfe':'none',outlineOffset:1,transition:'all 0.2s'}}>
                    {delConfirm===report.id?(
                      <div style={{textAlign:'center',padding:'16px 0'}}>
                        <div style={{fontSize:13,fontWeight:600,color:'#1c1917',marginBottom:6}}>Delete this report?</div>
                        <div style={{fontSize:11,color:'#78716c',marginBottom:14}}>This cannot be undone.</div>
                        <div style={{display:'flex',gap:8,justifyContent:'center'}}>
                          <Btn onClick={()=>{onDelete(report.id);setDelConfirm(null);showToast('Report deleted');}} variant="danger" size="sm">Yes, delete</Btn>
                          <Btn onClick={()=>setDelConfirm(null)} variant="secondary" size="sm">Cancel</Btn>
                        </div>
                      </div>
                    ):(
                      <>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
                          <div>
                            <div style={{fontWeight:700,fontSize:15,color:'#1c1917'}}>{report.data.name||'Unnamed Plan'}</div>
                            <div style={{fontSize:11,color:'#a8a29e',marginTop:2}}>{new Date(report.savedAt).toLocaleDateString('en-SG',{year:'numeric',month:'short',day:'numeric'})}</div>
                          </div>
                          <span style={{background:status.bg,color:status.tc,fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:99}}>{status.label}</span>
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
                          <div style={{background:'#fafaf9',borderRadius:8,padding:10,textAlign:'center'}}>
                            <div style={{fontSize:10,color:'#a8a29e',marginBottom:3}}>Retire at</div>
                            <div style={{fontSize:14,fontWeight:800,color:'#1c1917'}}>Age {report.data.retirementAge}</div>
                          </div>
                          <div style={{background:'#fafaf9',borderRadius:8,padding:10,textAlign:'center'}}>
                            <div style={{fontSize:10,color:'#a8a29e',marginBottom:3}}>Goal Progress</div>
                            <div style={{fontSize:14,fontWeight:800,color:r.goalProgress>=80?'#15803d':r.goalProgress>=50?'#b45309':'#dc2626'}}>{fmtPct(r.goalProgress)}</div>
                          </div>
                        </div>
                        <div style={{marginBottom:14}}>
                          <ProgressBar value={r.goalProgress} max={100} color={r.goalProgress>=80?'green':r.goalProgress>=50?'amber':'red'}/>
                        </div>
                        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                          <Btn onClick={()=>onView(report)} size="sm">View</Btn>
                          <Btn onClick={()=>toggleCompare(report.id)} variant={isComp?'primary':'secondary'} size="sm">{isComp?'✓ Comparing':'Compare'}</Btn>
                          <Btn onClick={()=>onDuplicate(report)} variant="secondary" size="sm">Duplicate</Btn>
                          <Btn onClick={()=>shareReport(report)} variant="teal" size="sm">🔗 Share</Btn>
                          <Btn onClick={()=>exportJSON(report)} variant="ghost" size="sm">JSON</Btn>
                          <Btn onClick={()=>setDelConfirm(report.id)} variant="danger" size="sm">Delete</Btn>
                        </div>
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
};

// ─── Welcome Page ─────────────────────────────────────────────────────────────────

  <div style={{minHeight:'100vh',background:'#F7F6F3',display:'flex',flexDirection:'column'}}>
    <header style={{background:'white',borderBottom:'1px solid #e7e5e4',padding:'14px 24px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:34,height:34,borderRadius:10,background:'#15803d',display:'flex',alignItems:'center',justifyContent:'center'}}>

          {icon:'🔗',title:'Fully Shareable',desc:'Share your plan as a link or self-contained file with anyone.'},
        ].map(item=>(
          <div key={item.title} style={{background:'white',border:'1px solid #e7e5e4',borderRadius:14,padding:18,textAlign:'left'}}>

// ─── App Root ─────────────────────────────────────────────────────────────────────

const App = ()=>{
  // Initialize state — check for shared plan in window global or URL hash
  const [formData,setFormData]=useState(()=>{
    if(window.__SHARED_PLAN__) return {...DEFAULT_STATE,...window.__SHARED_PLAN__};
    const hash=window.location.hash;
    if(hash.startsWith('#plan=')){
      const decoded=decodeState(hash.slice(6));
      if(decoded) return {...DEFAULT_STATE,...decoded};
    }
    return {...DEFAULT_STATE};
  });

  const [page,setPage]=useState(()=>{
    if(window.__SHARED_PLAN__) return 'report';
    const hash=window.location.hash;
    if(hash.startsWith('#plan=')){
      const decoded=decodeState(hash.slice(6));
      if(decoded) return 'report';
    }
    return 'welcome';
  });

  const [reports,setReports]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('rlp_v1_reports')||'[]');}catch{return[];}
  });
  const [viewingReport,setViewingReport]=useState(null);

  useEffect(()=>{
    try{localStorage.setItem('rlp_v1_reports',JSON.stringify(reports));}catch{}
  },[reports]);

  const nav=p=>{setPage(p);window.scrollTo(0,0);};

  const saveReport=()=>{
    if(viewingReport){
      setReports(prev=>prev.map(r=>r.id===viewingReport.id?{...r,data:{...formData},updatedAt:new Date().toISOString()}:r));
    }else{
      const report={id:Date.now().toString(),savedAt:new Date().toISOString(),data:{...formData}};
      setReports(prev=>[report,...prev]);
      setViewingReport(report);
    }
  };

  const reportData=viewingReport?viewingReport.data:formData;

  return(
    <ToastProvider>
      {page==='welcome'&&<WelcomePage onStart={()=>{setFormData({...DEFAULT_STATE});setViewingReport(null);nav('questionnaire');}} savedCount={reports.length} onViewSaved={()=>nav('saved')}/>}
      {page==='questionnaire'&&<QuestionnairePage data={formData} setData={setFormData} onComplete={()=>nav('report')} onBack={()=>nav('welcome')}/>}
      {page==='report'&&<ReportPage data={reportData} onEdit={()=>{if(viewingReport)setFormData({...viewingReport.data});nav('questionnaire');}} onSave={saveReport} onHome={()=>nav('welcome')} isSaved={!!viewingReport} onViewSaved={()=>nav('saved')}/>}
      {page==='saved'&&<SavedReportsPage reports={reports}
        onView={r=>{setViewingReport(r);nav('report');}}
        onDelete={id=>setReports(p=>p.filter(r=>r.id!==id))}
        onDuplicate={r=>{const d={...r,id:Date.now().toString(),savedAt:new Date().toISOString(),data:{...r.data,name:`${r.data.name||'Plan'} (Copy)`}};setReports(p=>[d,...p]);}}
        onHome={()=>nav('welcome')}
        onNew={()=>{setFormData({...DEFAULT_STATE});setViewingReport(null);nav('questionnaire');}}/>}
    </ToastProvider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
