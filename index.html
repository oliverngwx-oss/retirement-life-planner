    window.__PAGE_TEMPLATE__ = null;

        .then(function(r){ return r.text(); })

    *{box-sizing:border-box}
    body{background:#F7F6F3;font-family:system-ui,-apple-system,sans-serif;margin:0}
    .tooltip-wrap{position:relative;display:inline-flex}
    .tooltip-box{visibility:hidden;opacity:0;background:#1c1917;color:#e7e5e4;padding:6px 10px;
      border-radius:6px;font-size:11px;line-height:1.5;position:absolute;bottom:calc(100% + 6px);
      left:50%;transform:translateX(-50%);white-space:normal;z-index:200;width:200px;text-align:center;
      transition:opacity 0.15s;pointer-events:none}

    .slide-in{animation:slideIn 0.25s ease-out}
    @keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    .progress-bar-fill{transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}

    ::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:3px}
    @keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(20px)}}
    .toast-in{animation:toastIn 0.3s ease-out forwards}
    .toast-out{animation:toastOut 0.3s ease-in forwards}

// ─── Calculations ───────────────────────────────────────────────────────────────

function calcResults(s){
  const yearsToRetirement   = Math.max(0,(s.retirementAge||65)-(s.currentAge||35));
  const retirementDuration  = Math.max(0,(s.planningAge||85)-(s.retirementAge||65));
  const currentMonthlyNeed  = Object.values(s.expenses||{}).reduce((a,b)=>a+(+b||0),0);
  const inf = (+s.inflationRate||3)/100;
  const futureMonthlyNeed   = currentMonthlyNeed*Math.pow(1+inf,yearsToRetirement);
  const simpleTotalFundNeeded = futureMonthlyNeed*12*retirementDuration;
  const totalCurrentAssets  = (+s.currentCashSavings||0)+(+s.currentInvestments||0)+(+s.currentCPF||0)+(+s.currentRetirementPlans||0);
  const ar = (+s.preRetirementReturn||0)/100;
  const fvCurrentAssets     = totalCurrentAssets*Math.pow(1+ar,yearsToRetirement);
  const mr = ar/12, nm = yearsToRetirement*12, pmt = +s.monthlyContribution||0;
  const fvMonthlyContributions = mr===0||nm===0 ? pmt*nm : pmt*((Math.pow(1+mr,nm)-1)/mr);
  const projectedAssetsAtRetirement = fvCurrentAssets+fvMonthlyContributions;
  const monthlyRetirementIncome = (+s.cpfLifeMonthly||0)+(+s.rentalIncome||0)+(+s.businessIncome||0)+(+s.passiveIncome||0)+(+s.otherRetirementIncome||0);
  const projectedMonthlyFromAssets = retirementDuration>0 ? projectedAssetsAtRetirement/(retirementDuration*12) : 0;
  const totalProjectedMonthlyIncome = monthlyRetirementIncome+projectedMonthlyFromAssets;
  const retirementGap    = simpleTotalFundNeeded-projectedAssetsAtRetirement;
  const goalProgress     = simpleTotalFundNeeded>0 ? Math.min(150,(projectedAssetsAtRetirement/simpleTotalFundNeeded)*100) : 0;
  const monthlyIncomeGap = futureMonthlyNeed-totalProjectedMonthlyIncome;
  let monthlyTopUp=0;
  if(retirementGap>0&&nm>0){ monthlyTopUp = mr===0 ? retirementGap/nm : retirementGap*mr/(Math.pow(1+mr,nm)-1); }
  return {yearsToRetirement,retirementDuration,currentMonthlyNeed,futureMonthlyNeed,simpleTotalFundNeeded,
    totalCurrentAssets,fvCurrentAssets,fvMonthlyContributions,projectedAssetsAtRetirement,
    monthlyRetirementIncome,projectedMonthlyFromAssets,totalProjectedMonthlyIncome,
    retirementGap,goalProgress,monthlyIncomeGap,monthlyTopUp};
}

// ─── Sharing ────────────────────────────────────────────────────────────────────

function encodeState(data){
  try{ return btoa(encodeURIComponent(JSON.stringify(data))); }catch{ return null; }
}
function decodeState(encoded){
  try{ return JSON.parse(decodeURIComponent(atob(encoded))); }catch{ return null; }
}
function getShareUrl(data){
  const encoded = encodeState(data);
  if(!encoded) return null;
  return `${window.location.origin}${window.location.pathname}#plan=${encoded}`;
}
async function exportShareableFile(data){
  let html = window.__PAGE_TEMPLATE__;
  if(!html){
    try{ const r=await fetch(window.location.href); html=await r.text(); }
    catch{ return false; }
  }
  const stateJson = JSON.stringify(data);
  const updated = html.replace(
    'window.__SHARED_PLAN__ = null;',
    `window.__SHARED_PLAN__ = ${stateJson};`
  );
  const blob = new Blob([updated],{type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=`retirement-plan-${data.name||'shared'}.html`; a.click();
  URL.revokeObjectURL(url);
  return true;
}

const Btn = ({children,onClick,variant='primary',disabled=false,size='md'})=>{

  };
  return <button onClick={disabled?null:onClick} style={V[variant]||V.primary}>{children}</button>;
};
const ProgressBar = ({value,max=100,color='green'})=>{
  const pct=Math.min(100,Math.max(0,(value/max)*100));
  const bg=color==='green'?'#16a34a':color==='amber'?'#d97706':'#ef4444';
  return(
    <div style={{background:'#e7e5e4',borderRadius:99,height:8,overflow:'hidden'}}>
      <div className="progress-bar-fill" style={{height:8,borderRadius:99,background:bg,width:`${pct}%`}}/>
    </div>
  );
};
const DonutChart = ({progress,size=130})=>{
  const r=42,circ=2*Math.PI*r;
  const pct=Math.min(150,Math.max(0,progress));
  const disp=Math.min(100,pct);
  const offset=circ-(disp/100)*circ;
  const color=pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626';
  return(
    <svg width={size} height={size} viewBox="0 0 100 100">
      <circle cx="50" cy="50" r={r} fill="none" stroke="#f5f5f4" strokeWidth="14"/>
      <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="14"
        strokeDasharray={circ} strokeDashoffset={offset}
        strokeLinecap="round" transform="rotate(-90 50 50)"
        style={{transition:'stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1)'}}/>

  );
};

// ─── Toast ───────────────────────────────────────────────────────────────────────

const ToastContext = React.createContext(null);
const ToastProvider = ({children})=>{
  const [toasts,setToasts]=useState([]);
  const showToast = useCallback((msg,type='success')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2800);
  },[]);
  return(
    <ToastContext.Provider value={showToast}>
      {children}
      <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',
        display:'flex',flexDirection:'column',gap:8,zIndex:9999,alignItems:'center'}}>
        {toasts.map(t=>(
          <div key={t.id} className="toast-in" style={{
            background:t.type==='error'?'#1c1917':'#1c1917',
            color:'white',borderRadius:12,padding:'10px 18px',
            fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:8,
            boxShadow:'0 8px 24px rgba(0,0,0,0.2)',whiteSpace:'nowrap'}}>
            <span>{t.type==='success'?'✓':t.type==='error'?'✕':'ℹ'}</span>
            {t.msg}
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
};
const useToast = ()=>React.useContext(ToastContext);

const QuestionnairePage = ({data,setData,onComplete,onBack})=>{
  const [step,setStep]=useState(1);
  const [errs,setErrs]=useState({});
  const u=(key,val)=>setData(prev=>({...prev,[key]:val}));
  const validate=()=>{
    const e={};
    if((data.currentAge||0)<18||(data.currentAge||0)>100) e.currentAge='Please enter a valid age between 18 and 100.';
    if((data.retirementAge||0)<=(data.currentAge||0)) e.retirementAge='Retirement age must be greater than your current age.';
    if((data.planningAge||0)<=(data.retirementAge||0)) e.planningAge='Planning age must be greater than retirement age.';
    setErrs(e); return Object.keys(e).length===0;
  };
  const next=()=>{
    if(step===1&&!validate()) return;
    if(step<10){setStep(s=>s+1);window.scrollTo(0,0);}else onComplete();
  };
  const prev=()=>{
    if(step>1){setStep(s=>s-1);window.scrollTo(0,0);}else onBack();
  };
  const p={s:data,u,errs};
  return(
    <div style={{minHeight:'100vh',background:'#F7F6F3'}}>
      <header className="no-print" style={{background:'white',borderBottom:'1px solid #e7e5e4',padding:'14px 20px',display:'flex',alignItems:'center',gap:12}}>

        </button>
        <span style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:15,color:'#1c1917'}}>Retirement Life Planner</span>
      </header>
      <div style={{maxWidth:660,margin:'0 auto',padding:'28px 20px 80px'}}>
        <StepNav step={step} total={10}/>
        <Card style={{padding:28,marginBottom:20}}>
          {step===1&&<Step1 {...p}/>}  {step===2&&<Step2 {...p}/>}
          {step===3&&<Step3 {...p}/>}  {step===4&&<Step4 {...p}/>}
          {step===5&&<Step5 {...p}/>}  {step===6&&<Step6 {...p}/>}
          {step===7&&<Step7 {...p}/>}  {step===8&&<Step8 {...p}/>}

function generateAdvisorInsights(data, r) {
  const n = data.name ? data.name.split(' ')[0] : 'your client';
  const surplus = r.retirementGap <= 0;
  const progress = Math.round(r.goalProgress);
  const cur = data.currency;

  // Top expense categories
  const expSorted = EXPENSE_CATEGORIES
    .map(c=>({...c, amt: data.expenses[c.key]||0}))
    .filter(c=>c.amt>0).sort((a,b)=>b.amt-a.amt);
  const top2 = expSorted.slice(0,2);

  // Income source count
  const incomeSources = [data.cpfLifeMonthly,data.rentalIncome,data.businessIncome,data.passiveIncome,data.otherRetirementIncome].filter(v=>+v>0).length;

  const inflationImpact = r.futureMonthlyNeed - r.currentMonthlyNeed;
  const healthcareAmt = data.expenses.healthcare || 0;

  // ── Observations ──────────────────────────────────────────────────────────────
  const observations = [];

  if (surplus) {
    observations.push(`${n}'s current savings trajectory is projected to exceed the retirement target of ${fmt(r.simpleTotalFundNeeded,cur)} — a strong foundation that reflects consistent, disciplined planning.`);
  } else if (progress >= 70) {
    observations.push(`${n} is ${progress}% toward a retirement goal of ${fmt(r.simpleTotalFundNeeded,cur)}. The gap of ${fmt(r.retirementGap,cur)} is within reach over the next ${r.yearsToRetirement} years with focused effort.`);
  } else {
    observations.push(`${n} is currently ${progress}% toward a retirement target of ${fmt(r.simpleTotalFundNeeded,cur)}. The gap of ${fmt(r.retirementGap,cur)} is meaningful — and this conversation is an important starting point for building a clearer plan.`);
  }

  if (top2.length >= 2) {
    observations.push(`The two largest expected retirement expenses are ${top2[0].label.toLowerCase()} (${fmt(top2[0].amt,cur)}/month) and ${top2[1].label.toLowerCase()} (${fmt(top2[1].amt,cur)}/month). These carry the most planning weight and are worth exploring in the conversation.`);
  } else {
    observations.push(`The total expected monthly retirement lifestyle cost of ${fmt(r.currentMonthlyNeed,cur)} today will grow to ${fmt(r.futureMonthlyNeed,cur)} by retirement after inflation — a ${Math.round((r.futureMonthlyNeed/r.currentMonthlyNeed-1)*100)}% uplift worth discussing openly.`);
  }

  if (r.yearsToRetirement <= 0) {
    observations.push(`${n} is at or near retirement age. The planning emphasis shifts from accumulation to structuring a sustainable income drawdown strategy across a ${r.retirementDuration}-year retirement horizon.`);
  } else {
    observations.push(`${n} has a ${r.yearsToRetirement}-year accumulation window before retirement at age ${data.retirementAge}, followed by a ${r.retirementDuration}-year retirement phase to plan for.`);
  }

  // ── Concerns ─────────────────────────────────────────────────────────────────
  const concerns = [];

  if (surplus) {
    concerns.push(`Even with a projected surplus, sequence-of-returns risk — especially in the first decade of retirement — can erode accumulated wealth faster than expected. A structured withdrawal strategy will be important.`);
  } else if (progress < 60) {
    concerns.push(`The retirement funding gap of ${fmt(r.retirementGap,cur)} is significant. Without meaningful changes to contributions, lifestyle assumptions, or retirement timing, this gap is unlikely to close on its own.`);
  } else {
    concerns.push(`A retirement gap of ${fmt(r.retirementGap,cur)} remains. The position is encouraging, but maintaining contribution momentum and avoiding lifestyle inflation over the coming years will be key.`);
  }

  if (r.yearsToRetirement > 0 && r.yearsToRetirement < 10) {
    concerns.push(`With ${r.yearsToRetirement} years to retirement, the compounding window is narrowing. Each year of delay in addressing the gap has a proportionally larger impact now than earlier in the accumulation journey.`);
  } else if (incomeSources <= 1) {
    concerns.push(`The retirement income plan currently relies on ${incomeSources === 0 ? 'portfolio drawdown alone' : 'primarily one income source'}. A single-source plan is more vulnerable to market volatility, policy changes, and longevity risk.`);
  } else {
    concerns.push(`With ${incomeSources} retirement income sources in place, the next question is sequencing — knowing which source to draw from first and when, to minimise tax drag and depletion risk.`);
  }

  concerns.push(`Inflation will require ${fmt(inflationImpact,cur)} more per month at retirement compared to today's lifestyle cost — a ${Math.round((inflationImpact/r.currentMonthlyNeed)*100)}% real-terms uplift that clients often underestimate when they first see their retirement numbers.`);

  // ── Questions ─────────────────────────────────────────────────────────────────
  const questions = [];

  questions.push(`"When you look at this number — ${fmt(r.simpleTotalFundNeeded,cur)} — does it feel close to the retirement life you had in mind? Or does something need to change?"`);

  if (surplus) {
    questions.push(`"You're in a strong position. What would give you even more confidence — is it protecting what you've built, thinking about legacy, or exploring whether you could retire earlier?"`);
  } else {
    questions.push(`"If you had to adjust one thing — whether that's your lifestyle expectations, your retirement age, or how much you set aside monthly — which would feel most comfortable to start with?"`);
  }

  const topLabel = top2[0]?.label?.toLowerCase() || 'lifestyle expenses';
  questions.push(`"Which part of your retirement lifestyle feels most important to protect — even if we needed to make trade-offs elsewhere? For example, is it ${topLabel}, travel, or having flexibility with healthcare?"`);

  // ── Opportunities ─────────────────────────────────────────────────────────────
  const opportunities = [];

  if (!surplus && r.monthlyTopUp > 0) {
    opportunities.push(`Increasing the monthly retirement contribution by ${fmt(r.monthlyTopUp,cur)} would close the current gap by age ${data.retirementAge}. Even bridging half the gap now and reviewing in 12 months keeps the trajectory moving in the right direction.`);
  } else {
    opportunities.push(`The projected surplus of ${fmt(Math.abs(r.retirementGap),cur)} creates room for a meaningful legacy or gifting strategy — whether through a trust structure, family support plan, or charitable giving goals worth exploring together.`);
  }

  if (incomeSources < 2) {
    opportunities.push(`Building one additional income stream — such as a dividend portfolio, a rental property, or an annuity plan — would meaningfully reduce dependence on portfolio drawdown and improve income resilience across a long retirement.`);
  } else {
    opportunities.push(`With ${incomeSources} income sources in place, there is an opportunity to map out the optimal withdrawal sequence — which source to activate first, when to trigger CPF LIFE, and how to structure drawdowns to extend the plan's longevity.`);
  }

  if (healthcareAmt < 600) {
    opportunities.push(`The current healthcare allocation of ${fmt(healthcareAmt,cur)}/month may be worth reviewing. Medical costs in Singapore grow at 6–8% annually, and a critical illness or long-term care event in later retirement can materially affect accumulated wealth. Reviewing coverage now is significantly less costly than addressing it later.`);
  } else {
    opportunities.push(`Stress-testing this plan at a higher inflation rate — say 3.5–4% — would show the range of outcomes and help ${n} build confidence by preparing for less favourable scenarios alongside the base case.`);
  }

  return { observations, concerns, questions, opportunities };
}

function generateExecSummary(data, r) {
  const surplus = r.retirementGap <= 0;
  const cur = data.currency || 'SGD';
  const lifestyle = LIFESTYLE_PRESETS[data.lifestyleChoice]?.label || 'custom';
  let statusPhrase;
  if (surplus) {
    statusPhrase = `${data.name||'You'} ${data.name?'is':'are'} on track for a comfortable retirement, projected to exceed the target by ${fmt(Math.abs(r.retirementGap),cur)}.`;
  } else if (r.goalProgress >= 70) {
    statusPhrase = `With focused action on the areas below, the gap can be meaningfully closed — ${data.name||'you'} ${data.name?'is':'are'} currently ${fmtPct(r.goalProgress)} of the way there.`;
  } else {
    statusPhrase = `There is a meaningful opportunity to strengthen retirement readiness — ${data.name||'you'} ${data.name?'is':'are'} currently at ${fmtPct(r.goalProgress)} of the retirement goal.`;
  }
  const paragraph = `${data.name||'This plan'} targets a ${lifestyle} lifestyle in retirement starting at age ${data.retirementAge}, planning through to age ${data.planningAge} — a ${r.retirementDuration}-year retirement horizon. Today's lifestyle costs ${fmt(r.currentMonthlyNeed,cur)}/month, rising to an estimated ${fmt(r.futureMonthlyNeed,cur)}/month in future dollars, which implies a total fund target of ${fmt(r.simpleTotalFundNeeded,cur)}. ${statusPhrase}`;
  const stats = [
    {label:'Monthly Need at Retirement', value:fmt(r.futureMonthlyNeed,cur), color:'#1c1917'},
    {label:'Total Fund Target', value:fmt(r.simpleTotalFundNeeded,cur), color:'#1c1917'},
    {label:'Projected Assets', value:fmt(r.projectedAssetsAtRetirement,cur), color:'#15803d'},
    {label:'Goal Progress', value:fmtPct(r.goalProgress), color:r.goalProgress>=80?'#15803d':r.goalProgress>=50?'#b45309':'#dc2626'},
    {label:surplus?'Retirement Surplus':'Retirement Gap', value:fmt(Math.abs(r.retirementGap),cur), color:surplus?'#15803d':'#dc2626'},
    {label:surplus?'Status':'Monthly Top-Up Needed', value:surplus?'✓ On Track':fmt(r.monthlyTopUp,cur)+'/mo', color:surplus?'#15803d':'#b45309'},
  ];
  return {paragraph, stats};
}

function generateActionPlan(data, r) {
  const surplus = r.retirementGap <= 0;
  const cur = data.currency || 'SGD';
  const steps = [];
  if (!surplus) {
    steps.push({step:'Increase Your Monthly Contributions', desc:`Aim to save an additional ${fmt(r.monthlyTopUp,cur)}/month to close the projected retirement gap by age ${data.retirementAge}.`});
  } else {
    steps.push({step:'Protect Your Surplus', desc:`You're projected to exceed your retirement goal by ${fmt(Math.abs(r.retirementGap),cur)}. Consider life, critical illness, and long-term care insurance to preserve your projected assets.`});
  }
  if (r.goalProgress < 80) {
    steps.push({step:'Review Your Investment Allocation', desc:`Your pre-retirement return assumption is ${data.preRetirementReturn}%. Consider whether your portfolio is optimally positioned for growth over the next ${r.yearsToRetirement} years.`});
  }
  if (!data.cpfLifeMonthly || +data.cpfLifeMonthly < 800) {
    steps.push({step:'Maximise Your CPF Life Payouts', desc:'Consider topping up your CPF Special Account to grow your retirement income base and benefit from guaranteed, risk-free payouts.'});
  }
  if (!(+data.rentalIncome) && !(+data.passiveIncome) && !(+data.businessIncome)) {
    steps.push({step:'Build a Passive Income Stream', desc:'Diversifying into income-generating assets — REITs, dividend portfolios, or rental property — can reduce reliance on savings drawdown in retirement.'});
  }
  steps.push({step:'Review Your Retirement Lifestyle Assumptions', desc:`Your monthly lifestyle budget of ${fmt(r.currentMonthlyNeed,cur)} will rise to approximately ${fmt(r.futureMonthlyNeed,cur)} at retirement due to inflation. Confirm this aligns with your expected lifestyle.`});
  steps.push({step:'Schedule an Annual Review', desc:'Life circumstances change — income, expenses, family, and markets all evolve. Set a reminder to revisit this plan annually or after any major life event.'});
  return steps.slice(0,5);
}

const ExpenseBreakdownChart = ({expenses, currency}) => {

  const entries = Object.entries(expenses||{}).filter(([,v])=>+v>0);

  if(!total) return React.createElement('p',{style:{fontSize:12,color:'#a8a29e',textAlign:'center',padding:'12px 0'}},'No expenses entered.');
  return(

              <div style={{display:'flex',gap:8,alignItems:'center'}}>

              </div>
            </div>
            <div style={{height:6,background:'#f5f5f4',borderRadius:99,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${pct}%`,background:COLORS[i%COLORS.length],borderRadius:99}}/>

      const ta=document.createElement('textarea');

              {label:'Portfolio Return (Retirement)',value:`${data.portfolioReturnDuringRetirement}% p.a.`},
              {label:'Withdrawal Strategy',value:(data.withdrawalStrategy||'balanced').charAt(0).toUpperCase()+(data.withdrawalStrategy||'balanced').slice(1)},
            ].map(item=>(
              <div key={item.label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#fafaf9',border:'1px solid #e7e5e4',borderRadius:8,padding:'10px 14px'}}>
                <span style={{fontSize:11,color:'#78716c'}}>{item.label}</span>
                <span style={{fontSize:12,fontWeight:700,color:'#1c1917'}}>{item.value}</span>
              </div>
            ))}
          </div>
        </RSec>

        {/* ── 4. Current Retirement Position ── */}
        <RSec num="4" title="Current Retirement Position">
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:'#44403c',marginBottom:8}}>Retirement Assets</div>
              {[
                {label:'Cash Savings',value:data.currentCashSavings},
                {label:'Investments',value:data.currentInvestments},
                {label:'CPF Balances',value:data.currentCPF},
                {label:'Retirement Plans',value:data.currentRetirementPlans},
              ].map(item=>(
                <div key={item.label} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #f5f5f4'}}>
                  <span style={{fontSize:11,color:'#78716c'}}>{item.label}</span>
                  <span style={{fontSize:12,fontWeight:600,color:'#1c1917'}}>{fmt(+(item.value)||0,data.currency)}</span>
                </div>
              ))}
              <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderTop:'2px solid #e7e5e4',marginTop:4}}>
                <span style={{fontSize:11,fontWeight:700,color:'#44403c'}}>Total Assets</span>
                <span style={{fontSize:13,fontWeight:800,color:'#15803d'}}>{fmt(r.totalCurrentAssets,data.currency)}</span>
              </div>
            </div>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:'#44403c',marginBottom:8}}>Monthly Retirement Income</div>
              {[
                {label:'CPF Life',value:data.cpfLifeMonthly},
                {label:'Rental Income',value:data.rentalIncome},
                {label:'Business Income',value:data.businessIncome},
                {label:'Passive Income',value:data.passiveIncome},
                {label:'Other Income',value:data.otherRetirementIncome},
              ].map(item=>(
                <div key={item.label} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #f5f5f4'}}>
                  <span style={{fontSize:11,color:'#78716c'}}>{item.label}</span>
                  <span style={{fontSize:12,fontWeight:600,color:'#1c1917'}}>{fmt(+(item.value)||0,data.currency)}</span>
                </div>
              ))}
              <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderTop:'2px solid #e7e5e4',marginTop:4}}>
                <span style={{fontSize:11,fontWeight:700,color:'#44403c'}}>Total Monthly</span>
                <span style={{fontSize:13,fontWeight:800,color:'#15803d'}}>{fmt(r.monthlyRetirementIncome,data.currency)}</span>
              </div>
            </div>
          </div>
          <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:12,padding:'14px 18px',marginTop:16,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
            <div>
              <div style={{fontSize:10,color:'#78716c',marginBottom:3}}>Projected Assets at Retirement</div>
              <div style={{fontWeight:800,fontSize:20,color:'#15803d'}}>{fmt(r.projectedAssetsAtRetirement,data.currency)}</div>
            </div>
            <div>
              <div style={{fontSize:10,color:'#78716c',marginBottom:3}}>Monthly Contributions</div>
              <div style={{fontWeight:700,fontSize:14,color:'#1c1917'}}>{fmt(+(data.monthlyContribution)||0,data.currency)}/mo</div>
            </div>
            <div>
              <div style={{fontSize:10,color:'#78716c',marginBottom:3}}>Years to Retirement</div>
              <div style={{fontWeight:700,fontSize:14,color:'#1c1917'}}>{r.yearsToRetirement} yrs</div>
            </div>
          </div>
        </RSec>

        {/* ── 5. Gap Analysis ── */}
        <RSec num="5" title="Retirement Gap Analysis">
          <div style={{display:'flex',gap:20,alignItems:'center',flexWrap:'wrap',marginBottom:20}}>
            <div style={{flexShrink:0}}><DonutChart progress={r.goalProgress} size={130}/></div>
            <div style={{flex:1,minWidth:180}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <span style={{fontSize:12,color:'#78716c'}}>Progress to Goal</span>
                <span style={{fontSize:14,fontWeight:800,color:r.goalProgress>=80?'#15803d':r.goalProgress>=50?'#b45309':'#dc2626'}}>{fmtPct(r.goalProgress)}</span>
              </div>
              <ProgressBar value={r.goalProgress} max={100} color={barColor}/>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:14}}>
                {[
                  {label:'Fund Target',value:fmt(r.simpleTotalFundNeeded,data.currency)},
                  {label:'Projected Assets',value:fmt(r.projectedAssetsAtRetirement,data.currency),green:true},
                  {label:surplus?'Surplus':'Gap',value:fmt(Math.abs(r.retirementGap),data.currency),green:surplus,amber:!surplus},
                  {label:'Monthly Income Gap',value:fmt(Math.max(0,r.monthlyIncomeGap),data.currency),amber:!surplus&&r.monthlyIncomeGap>0},
                ].map(item=>(
                  <div key={item.label} style={{background:item.green?'#f0fdf4':item.amber?'#fffbeb':'#fafaf9',border:`1px solid ${item.green?'#bbf7d0':item.amber?'#fde68a':'#e7e5e4'}`,borderRadius:8,padding:'8px 10px'}}>
                    <div style={{fontSize:9,color:'#a8a29e',marginBottom:3,textTransform:'uppercase',letterSpacing:'0.06em'}}>{item.label}</div>
                    <div style={{fontWeight:700,fontSize:12,color:item.green?'#15803d':item.amber?'#b45309':'#1c1917'}}>{item.value}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          {!surplus&&(
            <div style={{background:'linear-gradient(135deg,#fffbeb,#fef3c7)',border:'2px solid #fde68a',borderRadius:16,padding:20,textAlign:'center'}}>
              <div style={{fontSize:10,color:'#92400e',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6,fontWeight:700}}>Estimated Additional Monthly Savings Needed</div>
              <div style={{fontWeight:800,fontSize:30,color:'#b45309'}}>{fmt(r.monthlyTopUp,data.currency)}<span style={{fontSize:14,color:'#d97706'}}>/month</span></div>
              <div style={{fontSize:11,color:'#78716c',marginTop:6}}>to close the gap by age {data.retirementAge}, assuming {data.preRetirementReturn}% pre-retirement return</div>
            </div>
          )}
          {surplus&&(
            <div style={{background:'linear-gradient(135deg,#f0fdf4,#dcfce7)',border:'2px solid #86efac',borderRadius:16,padding:20,textAlign:'center'}}>
              <div style={{fontSize:10,color:'#14532d',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6,fontWeight:700}}>Retirement Surplus</div>
              <div style={{fontWeight:800,fontSize:30,color:'#15803d'}}>{fmt(Math.abs(r.retirementGap),data.currency)}</div>
              <div style={{fontSize:11,color:'#78716c',marginTop:6}}>projected above your retirement target — you're on track!</div>
            </div>
          )}
        </RSec>

        {/* ── 6. Scenario Comparison ── */}
        <RSec num="6" title="Scenario Comparison" className="report-section-break">
          <p style={{fontSize:12,color:'#78716c',marginBottom:16,lineHeight:1.6}}>Explore how small changes to your plan can meaningfully impact your retirement outcome. Adjust the sliders to see different scenarios.</p>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
            <div style={{border:'2px solid #e7e5e4',borderRadius:16,padding:16}}>
              <div style={{fontSize:9,color:'#a8a29e',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:3}}>Scenario A</div>
              <div style={{fontSize:13,fontWeight:700,color:'#1c1917',marginBottom:14}}>Current Path</div>
              <div style={{fontSize:10,color:'#78716c',marginBottom:2}}>Monthly contribution</div>
              <div style={{fontSize:14,fontWeight:700,color:'#1c1917',marginBottom:10}}>{fmt(+(data.monthlyContribution)||0,data.currency)}/mo</div>
              <div style={{fontSize:10,color:'#78716c',marginBottom:2}}>Retirement age</div>
              <div style={{fontSize:14,fontWeight:700,color:'#1c1917',marginBottom:14}}>Age {data.retirementAge}</div>
              <ProgressBar value={r.goalProgress} max={100} color={barColor}/>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:7}}>
                <span style={{fontSize:10,color:'#78716c'}}>Progress</span>
                <span style={{fontSize:12,fontWeight:800,color:r.goalProgress>=80?'#15803d':r.goalProgress>=50?'#b45309':'#dc2626'}}>{fmtPct(r.goalProgress)}</span>
              </div>
              <div style={{fontSize:10,color:'#a8a29e',marginTop:7}}>Projected: {fmt(r.projectedAssetsAtRetirement,data.currency)}</div>
            </div>
            <div style={{border:'2px solid #bfdbfe',borderRadius:16,padding:16,background:'#eff6ff'}}>
              <div style={{fontSize:9,color:'#1d4ed8',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:3}}>Scenario B</div>
              <div style={{fontSize:13,fontWeight:700,color:'#1e3a8a',marginBottom:14}}>Save More</div>
              <div style={{fontSize:10,color:'#4b5563',marginBottom:4}}>Extra savings</div>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                <input type="range" min={5} max={50} value={extraSavingsPct} onChange={e=>setExtraSavingsPct(+e.target.value)} style={{flex:1,accentColor:'#1d4ed8'}}/>
                <span style={{fontSize:12,fontWeight:700,color:'#1d4ed8',minWidth:36}}>+{extraSavingsPct}%</span>
              </div>
              <div style={{fontSize:10,color:'#4b5563',marginBottom:2}}>New monthly</div>
              <div style={{fontSize:14,fontWeight:700,color:'#1e3a8a',marginBottom:14}}>{fmt(Math.round((+(data.monthlyContribution)||0)*(1+extraSavingsPct/100)),data.currency)}/mo</div>
              <ProgressBar value={scenB.goalProgress} max={100} color={scenB.goalProgress>=80?'green':scenB.goalProgress>=50?'amber':'red'}/>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:7}}>
                <span style={{fontSize:10,color:'#4b5563'}}>Progress</span>
                <span style={{fontSize:12,fontWeight:800,color:scenB.goalProgress>=80?'#15803d':scenB.goalProgress>=50?'#b45309':'#dc2626'}}>{fmtPct(scenB.goalProgress)}</span>
              </div>
              <div style={{fontSize:10,color:'#6b7280',marginTop:7}}>Projected: {fmt(scenB.projectedAssetsAtRetirement,data.currency)}</div>
            </div>
            <div style={{border:'2px solid #d8b4fe',borderRadius:16,padding:16,background:'#faf5ff'}}>
              <div style={{fontSize:9,color:'#7e22ce',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:3}}>Scenario C</div>
              <div style={{fontSize:13,fontWeight:700,color:'#581c87',marginBottom:14}}>Retire Later</div>
              <div style={{fontSize:10,color:'#4b5563',marginBottom:4}}>Extra years</div>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                <input type="range" min={1} max={10} value={retireYearsLater} onChange={e=>setRetireYearsLater(+e.target.value)} style={{flex:1,accentColor:'#7e22ce'}}/>
                <span style={{fontSize:12,fontWeight:700,color:'#7e22ce',minWidth:36}}>+{retireYearsLater}yr</span>
              </div>
              <div style={{fontSize:10,color:'#4b5563',marginBottom:2}}>New retirement age</div>
              <div style={{fontSize:14,fontWeight:700,color:'#581c87',marginBottom:14}}>Age {Math.min(75,(+(data.retirementAge)||65)+retireYearsLater)}</div>
              <ProgressBar value={scenC.goalProgress} max={100} color={scenC.goalProgress>=80?'green':scenC.goalProgress>=50?'amber':'red'}/>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:7}}>
                <span style={{fontSize:10,color:'#4b5563'}}>Progress</span>
                <span style={{fontSize:12,fontWeight:800,color:scenC.goalProgress>=80?'#15803d':scenC.goalProgress>=50?'#b45309':'#dc2626'}}>{fmtPct(scenC.goalProgress)}</span>
              </div>
              <div style={{fontSize:10,color:'#6b7280',marginTop:7}}>Projected: {fmt(scenC.projectedAssetsAtRetirement,data.currency)}</div>
            </div>
          </div>
        </RSec>

        {/* ── 7. Planning Focus Areas ── */}
        <RSec num="7" title="Planning Focus Areas">
          <div style={{background:focus.tone==='surplus'?'#f0fdf4':focus.tone==='near'?'#eff6ff':'#fffbeb',borderRadius:12,padding:'12px 16px',marginBottom:14,border:`1px solid ${focus.tone==='surplus'?'#bbf7d0':focus.tone==='near'?'#bfdbfe':'#fde68a'}`}}>
            <div style={{fontSize:12,fontWeight:700,color:focus.tone==='surplus'?'#14532d':focus.tone==='near'?'#1e40af':'#92400e'}}>{focus.heading}</div>
          </div>
          <ul style={{listStyle:'none',padding:0,margin:0,display:'flex',flexDirection:'column',gap:10}}>
            {focus.areas.map((area,i)=>(
              <li key={i} style={{display:'flex',alignItems:'flex-start',gap:10}}>
                <span style={{width:24,height:24,borderRadius:'50%',background:focus.tone==='surplus'?'#dcfce7':focus.tone==='near'?'#dbeafe':'#fef9c3',color:focus.tone==='surplus'?'#15803d':focus.tone==='near'?'#1d4ed8':'#92400e',fontSize:11,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>{i+1}</span>
                <span style={{fontSize:13,color:'#44403c',lineHeight:1.6}}>{area}</span>
              </li>
            ))}
          </ul>
        </RSec>

        {/* ── 8. Advisor Conversation Guide ── */}
        <RSec num="8" title="Advisor Conversation Guide" className="report-section-break">
          <div style={{background:'#0f172a',borderRadius:10,padding:'14px 18px',marginBottom:16}}>
            <p style={{fontSize:11,color:'#94a3b8',lineHeight:1.7,margin:0}}>The following guide supports advisor-led conversations. It is based on the client's plan inputs and is designed to complement — not replace — your professional judgment. It does not constitute financial advice.</p>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[
              {title:'Key Observations',emoji:'🔍',items:advisorIns.observations,bg:'#f0f9ff',border:'#bae6fd',tc:'#0c4a6e',tc2:'#0369a1',quote:false},
              {title:'Possible Concerns',emoji:'⚠️',items:advisorIns.concerns,bg:'#fffbeb',border:'#fde68a',tc:'#451a03',tc2:'#78350f',quote:false},
              {title:'Conversation Starters',emoji:'💬',items:advisorIns.questions,bg:'#f0fdf4',border:'#bbf7d0',tc:'#14532d',tc2:'#166534',quote:true},
              {title:'Planning Opportunities',emoji:'🌱',items:advisorIns.opportunities,bg:'#faf5ff',border:'#e9d5ff',tc:'#3b0764',tc2:'#6b21a8',quote:false},
            ].map(cat=>(
              <div key={cat.title} style={{background:cat.bg,border:`1px solid ${cat.border}`,borderRadius:12,padding:16}}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
                  <span>{cat.emoji}</span>
                  <span style={{fontSize:12,fontWeight:700,color:cat.tc}}>{cat.title}</span>
                </div>
                {cat.items.map((item,i)=>(
                  <div key={i} style={{display:'flex',gap:8,marginBottom:8}}>
                    <span style={{fontSize:10,fontWeight:700,color:cat.tc,flexShrink:0,marginTop:2}}>{i+1}.</span>
                    <span style={{fontSize:11,color:cat.tc2,lineHeight:1.65,fontStyle:cat.quote?'italic':'normal',borderLeft:cat.quote?`2px solid ${cat.border}`:'none',paddingLeft:cat.quote?8:0}}>{item}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </RSec>

        {/* ── 9. Action Plan ── */}
        <RSec num="9" title="Your Action Plan">
          <ol style={{listStyle:'none',padding:0,margin:0,display:'flex',flexDirection:'column',gap:12}}>
            {actionPlan.map((item,i)=>(
              <li key={i} style={{display:'flex',alignItems:'flex-start',gap:14,background:'#fafaf9',border:'1px solid #e7e5e4',borderRadius:12,padding:16}}>
                <span style={{width:28,height:28,borderRadius:'50%',background:'#1c1917',color:'white',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>{i+1}</span>
                <div>
                  <div style={{fontWeight:700,fontSize:13,color:'#1c1917',marginBottom:3}}>{item.step}</div>
                  <div style={{fontSize:12,color:'#78716c',lineHeight:1.65}}>{item.desc}</div>
                </div>
              </li>
            ))}
          </ol>
        </RSec>

        {/* ── 10. Risk & Disclaimer ── */}
        <div className="report-section" style={{background:'#fafaf9',border:'1px solid #e7e5e4',borderRadius:16,padding:'20px 24px',marginBottom:20}}>
          <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
            <span style={{fontSize:18,flexShrink:0}}>ℹ️</span>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'#44403c',marginBottom:8}}>Important Disclaimer</div>
              <p style={{fontSize:11,color:'#78716c',lineHeight:1.8,margin:0}}>
                This retirement plan is generated for illustrative and planning purposes only. It does not constitute financial, investment, legal, or tax advice. All projections are based on user-supplied inputs and mathematical models using assumed rates of return and inflation — actual outcomes will differ. Past market performance does not guarantee future results.
              </p>
              <p style={{fontSize:11,color:'#78716c',lineHeight:1.8,margin:'8px 0 0'}}>
                We recommend reviewing this plan at least annually and consulting a licensed financial adviser for personalised guidance tailored to your specific situation, goals, and risk tolerance.
              </p>
            </div>
          </div>
        </div>

        {/* ── Export/Save Footer ── */}
        <div className="no-print" style={{background:'white',borderRadius:16,border:'1px solid #e7e5e4',padding:'20px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:'#1c1917',marginBottom:2}}>Export & Save</div>
            <div style={{fontSize:11,color:'#a8a29e'}}>Download or share this retirement report</div>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {!isSaved&&<Btn onClick={onSave}>💾 Save to My Reports</Btn>}
            <Btn onClick={()=>setShowShare(true)} variant="teal">🔗 Share</Btn>
            <Btn onClick={exportJSON} variant="secondary">JSON</Btn>
            <Btn onClick={()=>window.print()} variant="secondary">🖨 Print / PDF</Btn>
          </div>
        </div>

      </div>
    </div>
  );
};

// ─── Saved Reports Page ────────────────────────────────────────────────────────────

const SavedReportsPage = ({reports,onView,onDelete,onDuplicate,onHome,onNew})=>{
  const [comparing,setComparing]=useState([]);
  const [delConfirm,setDelConfirm]=useState(null);
  const showToast=useToast();

  const toggleCompare=id=>setComparing(p=>p.includes(id)?p.filter(x=>x!==id):p.length<2?[...p,id]:p);

  const exportJSON=report=>{
    const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`retirement-plan-${report.data.name||'report'}.json`; a.click();
    URL.revokeObjectURL(url); showToast('Exported!');
  };

  const shareReport=async report=>{
    const ok=await exportShareableFile(report.data);
    if(ok) showToast('Shareable file downloaded!');
    else showToast('Could not generate file — try the Share button on the report view.','error');
  };

  const compareReports=comparing.map(id=>reports.find(r=>r.id===id)).filter(Boolean);
  return(
    <div style={{minHeight:'100vh',background:'#F7F6F3'}}>
      <header style={{background:'white',borderBottom:'1px solid #e7e5e4',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={onHome} style={{background:'none',border:'none',cursor:'pointer',color:'#a8a29e',display:'flex'}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:15,color:'#1c1917'}}>Saved Reports</span>
          <span style={{background:'#f5f5f4',borderRadius:99,padding:'2px 8px',fontSize:11,fontWeight:700,color:'#78716c'}}>{reports.length}</span>
        </div>
        <Btn onClick={onNew} size="sm">+ New Plan</Btn>
      </header>

      <div style={{maxWidth:860,margin:'0 auto',padding:'24px 20px 60px'}}>
        {reports.length===0?(
          <div style={{textAlign:'center',padding:'80px 20px'}}>
            <div style={{fontSize:48,marginBottom:16}}>📋</div>
            <h3 style={{fontFamily:'Georgia,serif',fontSize:20,fontWeight:700,color:'#44403c',marginBottom:8}}>No saved reports yet</h3>
            <p style={{fontSize:13,color:'#a8a29e',marginBottom:20}}>Create your first retirement plan to see your results saved here.</p>
            <Btn onClick={onNew}>Start Planning →</Btn>
          </div>
        ):(
          <>
            {comparing.length===2&&(
              <div style={{background:'white',border:'1px solid #e7e5e4',borderRadius:16,padding:20,marginBottom:20}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                  <span style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:15,color:'#1c1917'}}>Side-by-Side Comparison</span>
                  <Btn onClick={()=>setComparing([])} variant="ghost" size="sm">Clear</Btn>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  {compareReports.map(report=>{
                    const r=calcResults(report.data);
                    return(
                      <div key={report.id} style={{background:'#fafaf9',borderRadius:12,padding:16}}>
                        <div style={{fontWeight:700,fontSize:14,color:'#1c1917',marginBottom:12}}>{report.data.name||'Unnamed Plan'}</div>
                        {[
                          {l:'Retire at',v:`Age ${report.data.retirementAge}`},
                          {l:'Lifestyle',v:LIFESTYLE_PRESETS[report.data.lifestyleChoice]?.label||'Custom'},
                          {l:'Fund Needed',v:fmt(r.simpleTotalFundNeeded,report.data.currency)},
                          {l:'Projected Assets',v:fmt(r.projectedAssetsAtRetirement,report.data.currency)},
                          {l:'Goal Progress',v:fmtPct(r.goalProgress)},
                          {l:'Monthly Top-Up Needed',v:fmt(r.monthlyTopUp,report.data.currency)},
                        ].map(item=>(
                          <div key={item.l} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #e7e5e4'}}>
                            <span style={{fontSize:11,color:'#78716c'}}>{item.l}</span>
                            <span style={{fontSize:12,fontWeight:700,color:'#1c1917'}}>{item.v}</span>
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            {comparing.length===1&&(
              <div style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:10,padding:'10px 16px',marginBottom:16,fontSize:12,color:'#1e40af'}}>
                ℹ️ Select one more report to compare side by side.
              </div>
            )}
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:16}}>
              {reports.map(report=>{
                const r=calcResults(report.data);
                const surplus=r.retirementGap<=0;
                const isComp=comparing.includes(report.id);
                const status=surplus?{bg:'#dcfce7',tc:'#15803d',label:'Surplus'}
                  :r.goalProgress>=70?{bg:'#fef9c3',tc:'#92400e',label:'On Track'}
                  :{bg:'#fee2e2',tc:'#dc2626',label:'Gap'};
                return(
                  <div key={report.id} style={{background:'white',borderRadius:16,padding:20,
                    border:`2px solid ${isComp?'#93c5fd':'#e7e5e4'}`,
                    outline:isComp?'3px solid #bfdbfe':'none',outlineOffset:1,transition:'all 0.2s'}}>
                    {delConfirm===report.id?(
                      <div style={{textAlign:'center',padding:'16px 0'}}>
                        <div style={{fontSize:13,fontWeight:600,color:'#1c1917',marginBottom:6}}>Delete this report?</div>
                        <div style={{fontSize:11,color:'#78716c',marginBottom:14}}>This cannot be undone.</div>
                        <div style={{display:'flex',gap:8,justifyContent:'center'}}>
                          <Btn onClick={()=>{onDelete(report.id);setDelConfirm(null);showToast('Report deleted');}} variant="danger" size="sm">Yes, delete</Btn>
                          <Btn onClick={()=>setDelConfirm(null)} variant="secondary" size="sm">Cancel</Btn>
                        </div>
                      </div>
                    ):(
                      <>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
                          <div>
                            <div style={{fontWeight:700,fontSize:15,color:'#1c1917'}}>{report.data.name||'Unnamed Plan'}</div>
                            <div style={{fontSize:11,color:'#a8a29e',marginTop:2}}>{new Date(report.savedAt).toLocaleDateString('en-SG',{year:'numeric',month:'short',day:'numeric'})}</div>
                          </div>
                          <span style={{background:status.bg,color:status.tc,fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:99}}>{status.label}</span>
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
                          <div style={{background:'#fafaf9',borderRadius:8,padding:10,textAlign:'center'}}>
                            <div style={{fontSize:10,color:'#a8a29e',marginBottom:3}}>Retire at</div>
                            <div style={{fontSize:14,fontWeight:800,color:'#1c1917'}}>Age {report.data.retirementAge}</div>
                          </div>
                          <div style={{background:'#fafaf9',borderRadius:8,padding:10,textAlign:'center'}}>
                            <div style={{fontSize:10,color:'#a8a29e',marginBottom:3}}>Goal Progress</div>
                            <div style={{fontSize:14,fontWeight:800,color:r.goalProgress>=80?'#15803d':r.goalProgress>=50?'#b45309':'#dc2626'}}>{fmtPct(r.goalProgress)}</div>
                          </div>
                        </div>
                        <div style={{marginBottom:14}}>
                          <ProgressBar value={r.goalProgress} max={100} color={r.goalProgress>=80?'green':r.goalProgress>=50?'amber':'red'}/>
                        </div>
                        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                          <Btn onClick={()=>onView(report)} size="sm">View</Btn>
                          <Btn onClick={()=>toggleCompare(report.id)} variant={isComp?'primary':'secondary'} size="sm">{isComp?'✓ Comparing':'Compare'}</Btn>
                          <Btn onClick={()=>onDuplicate(report)} variant="secondary" size="sm">Duplicate</Btn>
                          <Btn onClick={()=>shareReport(report)} variant="teal" size="sm">🔗 Share</Btn>
                          <Btn onClick={()=>exportJSON(report)} variant="ghost" size="sm">JSON</Btn>
                          <Btn onClick={()=>setDelConfirm(report.id)} variant="danger" size="sm">Delete</Btn>
                        </div>
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
};

// ─── Welcome Page ─────────────────────────────────────────────────────────────────

const WelcomePage = ({onStart,savedCount,onViewSaved})=>(
  <div style={{minHeight:'100vh',background:'#F7F6F3',display:'flex',flexDirection:'column'}}>
    <header style={{background:'white',borderBottom:'1px solid #e7e5e4',padding:'14px 24px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:34,height:34,borderRadius:10,background:'#15803d',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <span style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:16,color:'#1c1917'}}>Retirement Life Planner</span>
      </div>
      {savedCount>0&&<button onClick={onViewSaved} style={{background:'none',border:'none',cursor:'pointer',fontSize:13,fontWeight:600,color:'#15803d'}}>My Reports ({savedCount})</button>}
    </header>
    <main style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'48px 24px',maxWidth:680,margin:'0 auto',width:'100%',textAlign:'center'}}>
      <div style={{display:'inline-flex',alignItems:'center',gap:6,background:'#f0fdf4',border:'1px solid #86efac',borderRadius:99,padding:'4px 12px',fontSize:11,fontWeight:700,color:'#15803d',marginBottom:28,letterSpacing:'0.04em'}}>
        <span style={{width:6,height:6,background:'#22c55e',borderRadius:'50%'}}></span>
        Retirement Planning
      </div>
      <h1 style={{fontFamily:'Georgia,serif',fontSize:42,fontWeight:700,color:'#1c1917',lineHeight:1.2,marginBottom:18}}>
        Design Your<br/>Retirement Life
      </h1>
      <p style={{fontSize:16,color:'#57534e',lineHeight:1.7,marginBottom:12,maxWidth:500}}>
        Before knowing how much you need, let's first understand the kind of life you want to live.
      </p>
      <p style={{fontSize:13,color:'#a8a29e',lineHeight:1.8,marginBottom:36,maxWidth:480}}>
        Retirement is not just a number — it's a lifestyle. This planner helps you estimate the monthly income you may need based on your desired lifestyle, current savings, future income sources, and retirement timeline. Along the way, we'll share real-world trends on longevity, inflation, and market returns to help you plan with confidence.
      </p>
      <button onClick={onStart}
        style={{background:'#15803d',color:'white',border:'none',borderRadius:14,padding:'14px 36px',fontSize:15,fontWeight:700,cursor:'pointer',boxShadow:'0 4px 14px rgba(21,128,61,0.25)',transition:'all 0.2s'}}
        onMouseEnter={e=>e.target.style.background='#166534'} onMouseLeave={e=>e.target.style.background='#15803d'}>
        Start Planning →
      </button>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginTop:56,width:'100%'}}>
        {[
          {icon:'📈',title:'Trend-Informed',desc:'Real longevity, inflation, and market data to help you plan with confidence.'},
          {icon:'🏡',title:'Lifestyle-Based',desc:'We start with the life you want, not abstract numbers.'},
          {icon:'🔗',title:'Fully Shareable',desc:'Share your plan as a link or self-contained file with anyone.'},
        ].map(item=>(
          <div key={item.title} style={{background:'white',border:'1px solid #e7e5e4',borderRadius:14,padding:18,textAlign:'left'}}>
            <div style={{fontSize:24,marginBottom:8}}>{item.icon}</div>
            <div style={{fontSize:13,fontWeight:700,color:'#1c1917',marginBottom:4}}>{item.title}</div>
            <div style={{fontSize:11,color:'#78716c',lineHeight:1.6}}>{item.desc}</div>
          </div>
        ))}
      </div>
    </main>
  </div>
);

// ─── App Root ─────────────────────────────────────────────────────────────────────

const App = ()=>{
  // Initialize state — check for shared plan in window global or URL hash
  const [formData,setFormData]=useState(()=>{
    if(window.__SHARED_PLAN__) return {...DEFAULT_STATE,...window.__SHARED_PLAN__};
    const hash=window.location.hash;
    if(hash.startsWith('#plan=')){
      const decoded=decodeState(hash.slice(6));
      if(decoded) return {...DEFAULT_STATE,...decoded};
    }
    return {...DEFAULT_STATE};
  });

  const [page,setPage]=useState(()=>{
    if(window.__SHARED_PLAN__) return 'report';
    const hash=window.location.hash;
    if(hash.startsWith('#plan=')){
      const decoded=decodeState(hash.slice(6));
      if(decoded) return 'report';
    }
    return 'welcome';
  });

  const [reports,setReports]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('rlp_v1_reports')||'[]');}catch{return[];}
  });
  const [viewingReport,setViewingReport]=useState(null);

  useEffect(()=>{
    try{localStorage.setItem('rlp_v1_reports',JSON.stringify(reports));}catch{}
  },[reports]);

  const nav=p=>{setPage(p);window.scrollTo(0,0);};

  const saveReport=()=>{
    if(viewingReport){
      setReports(prev=>prev.map(r=>r.id===viewingReport.id?{...r,data:{...formData},updatedAt:new Date().toISOString()}:r));
    }else{
      const report={id:Date.now().toString(),savedAt:new Date().toISOString(),data:{...formData}};
      setReports(prev=>[report,...prev]);
      setViewingReport(report);
    }
  };

  const reportData=viewingReport?viewingReport.data:formData;

  return(
    <ToastProvider>
      {page==='welcome'&&<WelcomePage onStart={()=>{setFormData({...DEFAULT_STATE});setViewingReport(null);nav('questionnaire');}} savedCount={reports.length} onViewSaved={()=>nav('saved')}/>}
      {page==='questionnaire'&&<QuestionnairePage data={formData} setData={setFormData} onComplete={()=>nav('generate')} onBack={()=>nav('welcome')}/>}
      {page==='generate'&&<ReportGenerationScreen data={formData} onGenerate={()=>{
        const report={id:Date.now().toString(),savedAt:new Date().toISOString(),data:{...formData}};
        setReports(prev=>[report,...prev]);setViewingReport(report);nav('report');
      }} onBack={()=>nav('questionnaire')}/>}
      {page==='report'&&<ReportPage data={reportData} onEdit={()=>{if(viewingReport)setFormData({...viewingReport.data});nav('questionnaire');}} onSave={saveReport} onHome={()=>nav('welcome')} isSaved={!!viewingReport} onViewSaved={()=>nav('saved')}/>}
      {page==='saved'&&<SavedReportsPage reports={reports}
        onView={r=>{setViewingReport(r);nav('report');}}
        onDelete={id=>setReports(p=>p.filter(r=>r.id!==id))}
        onDuplicate={r=>{const d={...r,id:Date.now().toString(),savedAt:new Date().toISOString(),data:{...r.data,name:`${r.data.name||'Plan'} (Copy)`}};setReports(p=>[d,...p]);}}
        onHome={()=>nav('welcome')}
        onNew={()=>{setFormData({...DEFAULT_STATE});setViewingReport(null);nav('questionnaire');}}/>}
    </ToastProvider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
